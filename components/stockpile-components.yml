note: >-
  This is the ONLY developer-facing surface Stockpile ever published: a drop-in JavaScript modal a
  partner site embedded to show stock/brand information and hand back a selected gift item. It was
  never accompanied by a REST API, an OpenAPI, or a developer portal. The component is retired — the
  repository is archived by the company and the CDN host that served the loader no longer resolves.
components:
- name: Stockpile Modal
  family: embeddable-widget
  status: retired
  description: >-
    Client-side modal that displays information about a stock or brand ("gift item") on a third-party
    site or web application, and returns the gift item the visitor selected via an onClose callback.
  repository: https://github.com/StockpileInc/stockpile-modal
  repository_archived: true
  repository_last_push: '2016-11-04'
  demo: https://modal.stockpile.com/demo.html
