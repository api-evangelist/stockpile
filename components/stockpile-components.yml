    url: https://modal.stockpile.com/init.js
    pinned: false
    host_dns: NXDOMAIN
    checked: '2026-08-29'
  environments:
  - qa
  - production
  auth:
    style: publishable-key
    init_signature: Stockpile.init('<environment>', '<publishable key>')
    key_format: pk_<environment>_<32 hex characters>
    issuance: >-
      By email request to dl-eng@stockpile.com — there was no self-service key issuance and no
      developer portal.
  api_surface:
    open: Stockpile.open(giftItemCode)
