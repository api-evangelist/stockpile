aid: stockpile
name: Stockpile
description: >-
  Stockpile was a Palo Alto, California consumer investing company — "the money app for families" —
  that let people buy, sell and gift fractional shares in stocks and ETFs, and that popularized the
  stock gift card, a physical or digital card redeemed into a brokerage account at Stockpile
  Investments, Inc. (a FINRA/SIPC member broker-dealer). Alongside custodial kid and teen accounts it
  sold Family Base and Family Plus subscriptions bundling debit cards and savings. The company wound
  down on April 17, 2026; customer accounts were moved to Public, Stash and Apex, and www.stockpile.com
  now serves only a Stockpile gift-card refund request form operated on the issuer's behalf by
  CIMI2603, Inc. Stockpile never published a public API, developer portal or machine-readable contract;
  its only public developer surface was an embeddable stock/brand modal, archived in 2016.
